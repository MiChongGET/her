<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Her · 生活陪伴交互原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2338462d'/%3E%3Ctext x='6' y='24' fill='%23c2d49f' font-size='24'%3E她%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="prototype-bar">
    <div class="prototype-label"><span class="tiny-leaf">✳</span><span>HER <i>/</i> 生活陪伴</span><span class="prototype-pill">交互原型</span></div>
    <div class="prototype-controls"><span class="fixture-note">示例内容 · 本地脚本回复 · 不连接真实服务</span><button id="scenes-toggle" class="scene-toggle" aria-expanded="false" aria-controls="scenes-panel">演示场景 <span>⌘</span></button></div>
  </div>

  <div id="window" class="her-window">
    <div class="titlebar"><div class="window-brand"><span class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="wordmark">Her</span></div><span class="window-motto">和你一起，把日子慢慢过好</span></div>
    <div id="app" class="app-layout"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <footer class="prototype-footer"><span id="prototype-status">日常 · 接着聊</span><span>所有人物与对话均为虚构示例；刷新页面会重置本次预览。</span><button data-action="reset">重新开始</button></footer>

  <aside id="scenes-panel" class="scenes-panel" aria-label="原型演示场景" hidden>
    <div class="scenes-head"><div><span class="eyebrow">仅用于评审</span><h2>换个状态看看</h2></div><button class="icon-button" data-action="close-scenes" aria-label="关闭演示场景">×</button></div>
    <p>这是原型控制台，不属于 Her 界面。选择场景会重置示例；平时可以直接在界面里点击和聊天。</p>
    <label class="scene-label" for="scene-picker">选择场景</label><select id="scene-picker"></select>
    <div id="scene-description" class="scene-description"></div>
    <div class="scene-shortcuts"><button data-scene="daily">日常</button><button data-scene="topics">一起在做的事</button><button data-scene="memory">她记得的事</button></div>
    <details class="state-inspector"><summary>查看原型状态</summary><pre id="state-inspector"></pre></details>
    <div class="scene-boundary">未接入模型、Her 数据库、系统权限或外部操作。记忆入口按方案保持未开放，旧测试对话不在本原型范围内。</div>
  </aside>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input id="file-picker" type="file" multiple hidden>
  <script src="prototype.js"></script>
</body>
</html>
