<h1>her · 会记得你的私人伙伴</h1>
<p class="intro">这轮让完整的小写 her 成为标识本身，功能图形延续“对话与记忆”的方向。</p>
<section class="grid" aria-label="两种完整 her 标识">
<article class="card"><div class="stage"><img class="lockup" src="her-lockup.svg" alt="完整her字标与记忆对话符号并列"></div>
<h2>A · 字标与符号并列</h2><p class="note">完整 her 清楚可读，左侧符号表达对话与记忆。<br>字标采用柔和的原创曲线，作为产品主品牌标识。</p>
<div class="mini"><img src="her-lockup.svg" width="160" height="60" alt="160px宽her组合标"><span>160px 宽使用示意</span></div></article>
<article class="card"><div class="stage"><img class="integrated" src="her-integrated.svg" alt="完整her字标融入带书签的对话图形"></div>
<h2>B · her 融进对话图形</h2><p class="note">完整单词、对话轮廓与记忆书签构成整体。<br>形态更紧凑，缩小时文字会更早失去细节。</p>
<div class="mini"><img src="her-integrated.svg" width="132" height="88" alt="132px宽her对话标"><span>132px 宽使用示意</span></div></article>
</section>
<p class="recommend">推荐 A 作为主品牌标识：名字最清楚，功能符号也能独立辨认。B 提供更紧凑的一体化选择。</p>
