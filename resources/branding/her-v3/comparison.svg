<text x="80" y="505" font-size="25">A · 字标与符号并列</text>
<text x="80" y="544" font-size="17" fill="#66765d">her 清楚可读，符号表达对话与记忆。</text>
<text x="80" y="575" font-size="16" fill="#777c74">字标带柔和的手写感，适合作为主品牌标识。</text>
<text x="764" y="505" font-size="25">B · her 融进对话图形</text>
<text x="764" y="544" font-size="17" fill="#66765d">完整单词、对话轮廓与记忆书签成为一个整体。</text>
<text x="764" y="575" font-size="16" fill="#777c74">图形更紧凑，缩小时文字会更早失去细节。</text>
